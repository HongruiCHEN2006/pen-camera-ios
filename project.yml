name: PenCamera

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  PenCamera:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongrui.pencamera
        PRODUCT_NAME: PenCamera
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1

schemes:
  PenCamera:
    build:
      targets:
        PenCamera: all
    run:
      config: Debug
    archive:
      config: Release

