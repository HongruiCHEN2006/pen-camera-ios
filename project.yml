name: PenCamera

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  PenCamera:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Pen Camera
        CFBundleShortVersionString: "0.8.0"
        CFBundleVersion: "8"
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: Pen Camera connects directly to the D7WN camera on its local Wi-Fi network.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongrui.pencamera
        PRODUCT_NAME: PenCamera
        MARKETING_VERSION: 0.8.0
        CURRENT_PROJECT_VERSION: 8
  PenCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PenCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongrui.pencamera.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PenCamera:
    build:
      targets:
        PenCamera: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - PenCameraTests
