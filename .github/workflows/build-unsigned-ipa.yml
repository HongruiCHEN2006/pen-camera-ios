name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Xcode 26.6 / iPhoneOS
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: EvenG2/package-lock.json

      - name: Build and package Even G2 companion
        working-directory: EvenG2
        run: |
          npm ci
          npm run pack

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run protocol and JPEG unit tests
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone")))')"
          xcodebuild \
            -project PenCamera.xcodeproj \
            -scheme PenCamera \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project PenCamera.xcodeproj \
            -scheme PenCamera \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Verify architecture and package IPA
        run: |
          app_path="build/DerivedData/Build/Products/Release-iphoneos/PenCamera.app"
          file "$app_path/PenCamera" | tee build/binary-architecture.txt
          grep -q 'arm64' build/binary-architecture.txt
          ./scripts/package-unsigned-ipa.sh "$app_path" build/package
          cp build/binary-architecture.txt build/package/
          cp EvenG2/Pen-Camera-G2.ehpk build/package/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: PenCamera-unsigned-${{ github.sha }}
          path: build/package/
          if-no-files-found: error
          retention-days: 30
