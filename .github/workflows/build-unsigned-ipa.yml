name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Xcode 26.6 / iPhoneOS
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project PenCamera.xcodeproj \
            -scheme PenCamera \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Verify architecture and package IPA
        run: |
          app_path="build/DerivedData/Build/Products/Release-iphoneos/PenCamera.app"
          file "$app_path/PenCamera" | tee build/binary-architecture.txt
          grep -q 'arm64' build/binary-architecture.txt
          ./scripts/package-unsigned-ipa.sh "$app_path" build/package
          cp build/binary-architecture.txt build/package/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PenCamera-unsigned-${{ github.sha }}
          path: build/package/
          if-no-files-found: error
          retention-days: 30

